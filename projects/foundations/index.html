<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>基石</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 96 96'%3E%3Crect width='96' height='96' rx='20' fill='%23f4efe3'/%3E%3Cpath fill='%231f2724' d='M39 12C22 21 14 34 14 49c0 16 9 29 25 35-8-13-10-25-5-36-5-10-3-22 5-36Z'/%3E%3Cpath fill='%231f2724' d='M57 12c17 9 25 22 25 37 0 16-9 29-25 35 8-13 10-25 5-36 5-10 3-22-5-36Z'/%3E%3C/svg%3E" />
    <style>
      :root {
        color-scheme: light;
        --ink: #1f2724;
        --ink-muted: rgba(31, 39, 36, 0.64);
        --paper: #f4efe3;
        --paper-soft: #fbf8ef;
        --paper-warm: #e8dcc8;
        --line: rgba(31, 39, 36, 0.14);
        --blue: #183c49;
        font-family:
          "Inter", "SF Pro Display", "PingFang SC", "Noto Sans SC", system-ui,
          sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        background:
          radial-gradient(circle at 16% 12%, rgba(164, 124, 56, 0.045), transparent 22%),
          radial-gradient(circle at 86% 26%, rgba(24, 60, 73, 0.075), transparent 30%),
          linear-gradient(rgba(31, 39, 36, 0.026) 1px, transparent 1px),
          linear-gradient(90deg, rgba(31, 39, 36, 0.022) 1px, transparent 1px),
          linear-gradient(145deg, var(--paper-soft), var(--paper) 64%, var(--paper-warm));
        background-size:
          auto,
          auto,
          72px 72px,
          72px 72px,
          auto;
      }

      body::before {
        position: fixed;
        inset: 0;
        z-index: -1;
        content: "";
        pointer-events: none;
        background:
          repeating-linear-gradient(8deg, transparent 0 18px, rgba(109, 88, 53, 0.03) 18px 19px),
          repeating-linear-gradient(96deg, transparent 0 34px, rgba(31, 39, 36, 0.018) 34px 35px);
        mix-blend-mode: multiply;
        opacity: 0.72;
      }

      a {
        color: inherit;
      }

      .shell {
        display: grid;
        align-content: center;
        gap: 34px;
        width: min(860px, calc(100vw - 32px));
        min-height: 100vh;
        margin: 0 auto;
        padding: 48px 0;
      }

      .back-link {
        width: max-content;
        color: var(--ink-muted);
        text-decoration: none;
      }

      .back-link:hover {
        color: var(--blue);
      }

      h1 {
        margin: 0;
        font-family: "Songti SC", "STSong", "Noto Serif SC", Georgia, serif;
        font-size: clamp(72px, 13vw, 132px);
        font-weight: 760;
        letter-spacing: 0;
        line-height: 0.92;
      }

      .intro {
        max-width: 640px;
        border-top: 1px solid var(--line);
        padding-top: 22px;
        color: var(--ink-muted);
        line-height: 1.8;
      }

      .doc-grid {
        display: grid;
        max-width: 760px;
        gap: 12px;
      }

      .doc-link {
        display: grid;
        gap: 8px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(251, 248, 239, 0.58);
        padding: 18px 20px;
        text-decoration: none;
      }

      .doc-link:hover {
        border-color: rgba(24, 60, 73, 0.34);
        background: rgba(251, 248, 239, 0.78);
      }

      .doc-link strong {
        color: var(--ink);
        font-family: "Songti SC", "STSong", "Noto Serif SC", Georgia, serif;
        font-size: 22px;
        font-weight: 650;
        line-height: 1.2;
      }

      .doc-link span {
        color: var(--ink-muted);
        line-height: 1.7;
      }
    </style>
  </head>
  <body data-page="foundations-project">
    <main class="shell">
      <a class="back-link" href="../">返回项目</a>
      <header>
        <h1>基石</h1>
      </header>
      <section class="intro" aria-label="Project status">
        面向 Agent / LLM Systems Engineer 的面试准备区，先建立可执行路线，再逐步沉淀 coding、system design、mock 和项目证据。
      </section>
      <section class="doc-grid" aria-label="Foundations documents">
        <a class="doc-link" href="README.md">
          <strong>README</strong>
          <span>项目入口、当前 track、使用方式和第一天行动。</span>
        </a>
        <a class="doc-link" href="multi-agent-planner.md">
          <strong>Multi-Agent Planner</strong>
          <span>可复用的 6-agent 面试准备规划模板。</span>
        </a>
        <a class="doc-link" href="llm-agent-engineer-roadmap.md">
          <strong>LLM / Agent Engineer Roadmap</strong>
          <span>面向顶尖 AI Lab 的弹性 30/45/60 天准备路线。</span>
        </a>
      </section>
    </main>
  </body>
</html>

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>投资 | NeuroScience x AI</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 96 96'%3E%3Crect width='96' height='96' rx='12' fill='%2311100e'/%3E%3Cpath fill='%23c7a665' d='M39 12C22 21 14 34 14 49c0 16 9 29 25 35-8-13-10-25-5-36-5-10-3-22 5-36Z'/%3E%3Cpath fill='%23c7a665' d='M57 12c17 9 25 22 25 37 0 16-9 29-25 35 8-13 10-25 5-36 5-10 3-22-5-36Z'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
    <link rel="stylesheet" href="../foundations/roadmap/roadmap-reader.css" />
    <link rel="stylesheet" href="finance-theme.css" />
  </head>
  <body data-page="finance-roadmap-reader" data-project-id="finance" data-theme="dark" data-annotation-scope="all-content">
    <script>
      (() => {
        try {
          const savedTheme = window.localStorage.getItem("financeReader.theme.v1");
          if (savedTheme === "light" || savedTheme === "dark") document.body.dataset.theme = savedTheme;
        } catch {
          // The static dark theme remains usable when browser storage is unavailable.
        }
      })();
    </script>
    <div class="reader-shell is-note-collapsed" id="reader-shell">
      <div class="search-focus-layer" id="search-overlay" aria-hidden="true"></div>

      <header class="reader-toolbar" id="reader-toolbar">
        <div class="toolbar-left">
          <a class="project-mark" href="../index.html" aria-label="返回项目">
            <svg class="title-x-mark" viewBox="0 0 96 96" aria-hidden="true" focusable="false">
              <path class="title-x-left-bleed" d="M39 10 C22 19 13 34 13 49 C13 66 23 81 41 88 C32 73 29 59 34 48 C29 38 31 24 39 10 Z" />
              <path class="title-x-left-core" d="M41 13 C26 22 18 35 18 49 C18 63 27 76 41 83 C35 71 33 59 38 48 C33 38 35 25 41 13 Z" />
              <path class="title-x-right-core" d="M55 13 C70 22 78 35 78 49 C78 63 69 76 55 83 C61 71 63 59 58 48 C63 38 61 25 55 13 Z" />
            </svg>
          </a>
          <button class="icon-button mobile-directory-toggle" type="button" aria-label="打开模块目录" aria-controls="module-directory" aria-expanded="false" data-toggle-left>
            <svg width="21" height="21" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 5h16v14H4V5Z M9 5v14 M12 9h5 M12 13h5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
        </div>

        <div class="toolbar-right">
          <div class="toolbar-search">
            <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="m21 21-4.2-4.2M10.8 18a7.2 7.2 0 1 1 0-14.4Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            </svg>
            <input id="global-search" type="search" autocomplete="off" placeholder="搜索术语与概念" aria-label="全局搜索" />
            <kbd class="search-shortcut">⌘ K</kbd>
          </div>
          <div class="toolbar-controls">
            <button class="icon-button" id="toggle-theme" type="button" aria-label="切换日间模式" aria-pressed="true">
              <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="3.6" fill="none" stroke="currentColor" stroke-width="1.7" />
                <path d="M12 2.6v2M12 19.4v2M2.6 12h2M19.4 12h2M5.35 5.35l1.42 1.42M17.23 17.23l1.42 1.42M18.65 5.35l-1.42 1.42M6.77 17.23l-1.42 1.42" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
              </svg>
            </button>
            <button class="icon-button" id="toggle-note" type="button" aria-label="展开学习批注" aria-controls="note-panel-content mobile-note-drawer" aria-expanded="false">
              <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20 5H4M20 12H8M20 19H4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
              </svg>
            </button>
          </div>
          <div class="search-results" id="search-results" hidden></div>
        </div>
      </header>

      <aside class="reader-sidebar" id="module-directory" aria-label="模块目录">
        <div class="directory-surface">
          <div class="directory-header">
            <div>
              <p class="directory-kicker">学习路径</p>
              <p class="directory-title">投资</p>
            </div>
            <button class="icon-button directory-toggle" id="toggle-left" type="button" aria-label="收起模块目录" aria-controls="module-directory" aria-expanded="true" data-toggle-left>
              <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </button>
          </div>
          <nav class="module-nav" id="module-nav" aria-label="投资学习模块"></nav>
        </div>
        <div class="section-rail" id="section-rail" aria-label="章节索引">
          <button class="icon-button rail-toggle" type="button" aria-label="展开模块目录" aria-controls="module-directory" aria-expanded="false" data-toggle-left>
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
          <div class="section-lines" id="section-lines"></div>
        </div>
      </aside>

      <main class="reader-main" id="reader-main">
        <section class="module-header" id="module-header" aria-label="模块信息"></section>
        <section class="section-list" id="section-list" aria-label="模块正文">
          <article class="status-panel">
            <h2>正在加载学习内容</h2>
            <p>读取 roadmap/roadmap-data.json。</p>
          </article>
        </section>
      </main>

      <aside class="note-panel" id="note-panel" aria-label="学习批注">
        <div class="note-rail">
          <button class="note-rail-button" id="note-rail-toggle" type="button" aria-label="展开学习批注" aria-controls="note-panel-content" aria-expanded="false">
            <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 4.5h9.5A2.5 2.5 0 0 1 18 7v12.5H8.5A2.5 2.5 0 0 1 6 17V4.5Zm0 12.5a2.5 2.5 0 0 1 2.5-2.5H18M9.5 8h5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <span class="note-count" id="note-count" aria-label="0 条批注">0</span>
          </button>
        </div>
        <div class="note-panel-content" id="note-panel-content">
          <p class="note-label" id="note-label">学习过程记录</p>
          <div class="note-surface" id="note-surface"></div>
        </div>
      </aside>

      <button class="drawer-backdrop" id="drawer-backdrop" type="button" aria-label="关闭抽屉" data-close-drawers></button>

      <aside class="mobile-note-drawer" id="mobile-note-drawer" role="dialog" aria-modal="true" aria-hidden="true" aria-label="移动端学习批注" tabindex="-1">
        <div class="mobile-note-header">
          <p class="note-label" id="mobile-note-label">学习过程记录</p>
          <button class="icon-button mobile-note-close" id="close-mobile-note" type="button" aria-label="关闭学习批注">
            <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            </svg>
          </button>
        </div>
        <div class="note-surface" id="mobile-note-surface"></div>
      </aside>

      <p class="visually-hidden" id="reader-announcer" aria-live="polite" aria-atomic="true"></p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script type="module" src="../foundations/roadmap/roadmap-reader.js" data-source="roadmap/roadmap-data.json"></script>
  </body>
</html>
